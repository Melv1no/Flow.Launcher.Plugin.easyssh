# Publishes a GitHub release each time the version in plugin.json changes on master.
# The Flow Launcher plugin manifest checks the latest release of the repository every few hours and
# offers the update to users: there is nothing else to do once the version is bumped and merged.
name: Release

on:
  push:
    branches: [ master ]
    paths: [ 'Flow.Launcher.Plugin.easyssh/plugin.json' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content Flow.Launcher.Plugin.easyssh/plugin.json -Raw | ConvertFrom-Json).Version
          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release $version already exists, nothing to publish." }
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.exists == 'false'
        with:
          dotnet-version: 9.0.x

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: dotnet test Flow.Launcher.Plugin.easyssh.sln --configuration Release

      - name: Package
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./scripts/package.ps1 -Configuration Release

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:VERSION artifacts/easyssh.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "EasySSH v$env:VERSION" `
            --generate-notes
